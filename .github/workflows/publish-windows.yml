name: Publish Windows Installer

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-and-publish:
    runs-on: windows-latest
    permissions:
      contents: write   # Required for creating GitHub releases and uploading assets

    # Do NOT set NODE_ENV=production on the job: npm ci would skip devDependencies
    # (vite, electron, electron-builder) and the build would fail.
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build and publish Windows installer
        run: |
          node scripts/with-production-env-only.js -- npm run build
          npm run release:win

      - name: Upload artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: release/*.exe
          retention-days: 7
